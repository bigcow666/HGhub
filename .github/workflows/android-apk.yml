
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build HGhub ARM64 APK
    runs-on: ubuntu-latest

    steps:
      # ================= 第一阶段：获取源码 =================
      - name: Checkout
        uses: actions/checkout@v4

      # ================= 第二阶段：配置 Java =================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ================= 第三阶段：编译前验证签名密钥 =================
      - name: Validate Signing Keystore BEFORE BUILD
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "========== 检查 GitHub Secrets =========="

          test -n "$KEYSTORE_BASE64" || {
            echo "::error::ANDROID_KEY_BASE64 未设置"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "::error::ANDROID_KEY_ALIAS 未设置"
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "::error::ANDROID_KEYSTORE_PASSWORD 未设置"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "::error::ANDROID_KEY_PASSWORD 未设置"
            exit 1
          }

          echo "四项 Secrets 均已设置"

          echo "========== Base64 解码 =========="

          KS="$RUNNER_TEMP/HGhub-release.p12"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"

          test -s "$KS" || {
            echo "::error::密钥文件为空"
            exit 1
          }

          echo "密钥文件大小：$(wc -c < "$KS") bytes"

          echo "========== 检查 PKCS12 密钥库 =========="

          keytool -list \
            -storetype PKCS12 \
            -keystore "$KS" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "========== 验证私钥密码 =========="

          keytool -importkeystore \
            -srckeystore "$KS" \
            -srcstoretype PKCS12 \
            -srcstorepass "$STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/verify.p12" \
            -deststoretype PKCS12 \
            -deststorepass "$STORE_PASSWORD" \
            -destkeypass "$KEY_PASSWORD" \
            -destalias verify \
            -noprompt

          echo "========== 签名密钥验证成功 =========="

          rm -f "$RUNNER_TEMP/verify.p12"

          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      # ================= 第四阶段：配置 Node 和 pnpm =================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ================= 第五阶段：配置 Android SDK / NDK =================
      - name: Setup Android SDK and NDK
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKM" --licenses >/dev/null 2>&1 || true

          "$SDKM" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # ================= 第六阶段：配置 Rust =================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ================= 第七阶段：安装项目依赖 =================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ================= 第八阶段：初始化 Android =================
      - name: Initialize Android project
        run: pnpm tauri android init --ci

      # ================= 第九阶段：编译 ARM64 APK =================
      - name: Build ARM64 APK
        run: pnpm tauri android build --apk --split-per-abi --target aarch64

      # ================= 第十阶段：签名 APK =================
      - name: Sign ARM64 APK
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"

          APK="$(find src-tauri/gen/android/app/build/outputs/apk \
            -type f -name '*release*.apk' | head -1)"

          test -n "$APK" || {
            echo "::error::没有找到 Release APK"
            exit 1
          }

          mkdir -p artifacts

          echo "待签名 APK：$APK"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v4-signing-enabled false \
            --out artifacts/HGhub-ARM64.apk \
            "$APK"

          echo "========== 验证 APK 签名 =========="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            artifacts/HGhub-ARM64.apk

          echo "========== APK 签名成功 =========="

          ls -lh artifacts/

      # ================= 第十一阶段：上传 APK =================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-ARM64-APK
          path: artifacts/HGhub-ARM64.apk
          if-no-files-found: error
          retention-days: 7

      # ================= 第十二阶段：清理密钥 =================
      - name: Cleanup Signing Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/HGhub-release.p12"
          rm -f "$RUNNER_TEMP/verify.p12"
          echo "临时密钥文件已清理"
